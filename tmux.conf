# ── Prefix ──
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ──
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 50
set -g default-terminal "tmux-256color"

# Ghostty true color + extended keys (Shift+Enter etc for Claude Code)
set -as terminal-features ",xterm-ghostty:RGB"
set -g extended-keys on
set -as terminal-features ",xterm-ghostty:extkeys"

# ── Splits (open in current pane's directory) ──
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}" "claude" \; select-pane -T "claude"
bind _ split-window -v -c "#{pane_current_path}" "claude" \; select-pane -T "claude"
unbind '"'
unbind %

# ── Splits without prefix ──
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-s split-window -v -c "#{pane_current_path}"
bind -n M-C-v split-window -h -c "#{pane_current_path}" "claude" \; select-pane -T "claude"
bind -n M-C-s split-window -v -c "#{pane_current_path}" "claude" \; select-pane -T "claude"
bind -n M-C-h split-window -v -c "#{pane_current_path}" "claude" \; select-pane -T "claude"

# ── Pane titles (pane_title is app-controlled, Claude Code stomps it, so we use @paneName instead) ──
set -g pane-border-status top
# the name sits in range=control|0 so clicks on it arrive as *Control0 mouse keys, separate from the rest of the border (see Pane title drag below)
# while dragging: the dragged pane's title turns peach with a ⇄, the pane it would swap with turns yellow
set -g pane-border-format "#{?#{==:#{pane_id},#{@paneDragSrc}},#[fg=#{@thm_crust} bg=#{@thm_peach} bold] ⇄ ,#{?#{==:#{pane_id},#{@paneDropTgt}},#[fg=#{@thm_crust} bg=#{@thm_yellow} bold] ,#[fg=white bold] }}#[range=control|0]#{?#{@paneName},#{@paneName},#{pane_title}}#[norange] "
set -g pane-active-border-style "fg=magenta"
set -g window-active-style "#{?@paneIdle,bg=#476268,bg=#{@thm_surface_0}}"
set -g window-style "#{?@paneIdle,bg=#35454f,bg=#{@thm_bg}}"
bind N command-prompt -p "pane name:" "set -p @paneName '%%'"
bind -T root DoubleClick1Border command-prompt -p "pane name:" "set -p @paneName '%%'"

# clicking an actual pane (not a bar pill) doesn't otherwise trigger a status refresh, so the bar's highlight would wait for the next 5s status-interval tick
bind -T root MouseDown1Pane if-shell -F "#{@paneDragSrc}" { run-shell "~/.local/bin/tmux-pane-drag cancel '#{client_name}'" } \; select-pane -t = \; send-keys -M \; refresh-client -S
# tmux's default ctrl+click swaps panes; forward it instead so Claude Code's ctrl+click opens links and file paths
bind -T root C-MouseDown1Pane select-pane -t = \; send-keys -M \; refresh-client -S

# ── Catch a drag release on any surface, not just the bar itself (pane content, pane border) ──
# gated on an active drag so an ordinary click doesn't pay for a script spawn every time
bind -T root MouseUp1Pane if-shell -F "#{||:#{@dragSourcePane},#{@dragSourceWin}}" { run-shell "~/.local/bin/tmux-bar-drag-commit '#{client_name}'" } { send-keys -M }
bind -T root MouseUp1Border if-shell -F "#{||:#{@dragSourcePane},#{@dragSourceWin}}" { run-shell "~/.local/bin/tmux-bar-drag-commit '#{client_name}'" }
# pressing a pill arms its drag, so a plain click (press and release, no drag) has to disarm it again
bind -T root MouseUp1Status if-shell -F "#{||:#{@dragSourcePane},#{@dragSourceWin}}" { run-shell "~/.local/bin/tmux-bar-drag-commit '#{client_name}'" }

# ── Pane bar clicks: select / rename / kill, routed by whether the click hit a pane range or a window range ──
bind -T root MouseDown1Status if-shell -F "#{==:#{mouse_status_range},pane}" { select-pane -t = ; set -Fg @dragSourcePane "#{pane_id}" ; refresh-client -S } { switch-client -t = ; set -Fg @dragSourceWin "#{window_id}" ; refresh-client -S }
bind -T root DoubleClick1Status if-shell -F "#{==:#{mouse_status_range},pane}" { command-prompt -I "#{@paneName}" -p "pane name:" { set -p @paneName "%%" } } { command-prompt -I "#{window_name}" -p "window name:" { rename-window "%%" } }
bind -T root MouseDown3Status if-shell -F "#{==:#{mouse_status_range},pane}" { confirm-before -p "kill pane #{pane_index}? (y/n)" { kill-pane -t = } } { display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W "#{?#{>:#{session_windows},1},,-}Swap Left" l { swap-window -t :-1 } "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } "#{?pane_marked_set,,-}Swap Marked" s { swap-window } '' Kill X { kill-window } Respawn R { respawn-window -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } '' "New After" w { new-window -a } "New At End" W { new-window } }

# ── Drag to reorder: both bars show a real insertion marker (left/right half of a pill = before/after it) ──
# dispatch on which drag is actually active, not on where the cursor currently is, otherwise straying onto the other bar mid-drag shows its marker too
# freeze rather than update the marker while hovering the other bar, since its x-columns don't correspond to this one's items
# in a status event #{window_id} is the hovered window, so the W: loop picks out the current one
# a dragged pane (by its pill or its title) over the window bar targets either a window to move into or a gap to open a new window in, see tmux-window-bar-drop
bind -T root MouseDrag1Status if-shell -F "#{||:#{@paneDragSrc},#{@dragSourcePane}}" {
  if-shell -F "#{==:#{mouse_status_line},0}" { run-shell "~/.local/bin/tmux-window-bar-drop '#{session_name}' '#{mouse_x}' '#{W:#{?window_active,#{window_id},}}' '#{@paneDropWin}' '#{@paneDropWinBefore}' '#{client_name}'" } {
    if-shell -F "#{||:#{@paneDropWin},#{@paneDropWinBefore}}" { set -gu @paneDropWin ; set -gu @paneDropWinBefore ; refresh-client -S }
    if-shell -F "#{&&:#{@dragSourcePane},#{!=:#{mouse_status_range},window}}" { run-shell "~/.local/bin/tmux-bar-drag-update /tmp/tmux-pane-bar-spans-'#{window_id}' /tmp/tmux-pane-bar-insert-'#{window_id}' '#{mouse_x}' @dragInsertBefore '#{client_name}'" }
  }
} { if-shell -F "#{&&:#{@dragSourceWin},#{!=:#{mouse_status_range},pane}}" { run-shell "~/.local/bin/tmux-bar-drag-update /tmp/tmux-window-bar-spans-'#{session_name}' /tmp/tmux-window-bar-insert-'#{session_name}' '#{mouse_x}' @dragInsertBeforeWin '#{client_name}'" } }
# drop always acts on the marker's last known position, not on wherever the release pixel happens to resolve to
bind -T root MouseDragEnd1Status if-shell -F "#{@paneDragSrc}" { run-shell "~/.local/bin/tmux-pane-drag end '#{client_name}' ''" } { run-shell "~/.local/bin/tmux-bar-drag-commit '#{client_name}'" }

# ── Pane title drag: grab a pane by the name in its top border, drop it on another pane to swap the two, or on a window pill to move it there ──
# a press can't happen mid-drag, so a title drag still recorded at press time is left over from a release tmux never saw (see also MouseDown1Pane and MouseDown1Border)
bind -T root MouseDown1Control0 if-shell -F "#{@paneDragSrc}" { run-shell "~/.local/bin/tmux-pane-drag cancel '#{client_name}'" }
bind -T root MouseDown1Border if-shell -F "#{@paneDragSrc}" { run-shell "~/.local/bin/tmux-pane-drag cancel '#{client_name}'" } \; select-pane -M
bind -T root MouseDrag1Control0 if-shell -F "#{@paneDragSrc}" {} { run-shell "~/.local/bin/tmux-pane-drag start '#{pane_id}' '#{client_name}'" }
bind -T root DoubleClick1Control0 select-pane -t = \; command-prompt -I "#{@paneName}" -p "pane name:" { set -p -t = @paneName "%%" }
# tmux keeps reporting every drag against the pane it started in, so while any pane or pill drag is live these must not select text or resize splits
# the pointer is off the window bar here, so any window drop target it left behind no longer applies
bind -T root MouseDrag1Pane if-shell -F "#{||:#{@paneDragSrc},#{||:#{@dragSourcePane},#{@dragSourceWin}}}" { if-shell -F "#{||:#{@paneDropWin},#{@paneDropWinBefore}}" { set -gu @paneDropWin ; set -gu @paneDropWinBefore ; refresh-client -S } } { if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -M } }
bind -T root MouseDrag1Border if-shell -F "#{||:#{@paneDragSrc},#{||:#{@dragSourcePane},#{@dragSourceWin}}}" { if-shell -F "#{||:#{@paneDropWin},#{@paneDropWinBefore}}" { set -gu @paneDropWin ; set -gu @paneDropWinBefore ; refresh-client -S } } { resize-pane -M }
# the release is the one event tmux resolves to the pane actually under the pointer, so the drop target comes from here, not from the hover highlight
bind -T root MouseDragEnd1Pane if-shell -F "#{@paneDragSrc}" { run-shell "~/.local/bin/tmux-pane-drag end '#{client_name}' '#{pane_id}'" } { if-shell -F "#{||:#{@dragSourcePane},#{@dragSourceWin}}" { run-shell "~/.local/bin/tmux-bar-drag-commit '#{client_name}'" } { send-keys -M } }
bind -T root MouseDragEnd1Border if-shell -F "#{@paneDragSrc}" { run-shell "~/.local/bin/tmux-pane-drag end '#{client_name}' '#{pane_id}'" } { if-shell -F "#{||:#{@dragSourcePane},#{@dragSourceWin}}" { run-shell "~/.local/bin/tmux-bar-drag-commit '#{client_name}'" } }
bind -T root MouseDragEnd1Control0 if-shell -F "#{@paneDragSrc}" { run-shell "~/.local/bin/tmux-pane-drag end '#{client_name}' '#{pane_id}'" }

# ── Pane navigation without prefix ──
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ── Window navigation ──
bind -n M-H previous-window
bind -n M-L next-window

bind T select-layout tiled
bind V select-layout even-vertical
bind -n M-t run-shell 'tmux display-message "theme: $(~/.local/bin/ghostty-theme-cycle)"; xdotool key --clearmodifiers ctrl+shift+comma'
bind -n M-r run-shell 'tmux display-message "theme: $(~/.local/bin/ghostty-theme-cycle --reverse)"; xdotool key --clearmodifiers ctrl+shift+comma'

# ── Clickable window bar and pane bar (left-click select, double-click rename, right-click kill, drag to reorder with an insertion marker) ──
set -g status 4
set -g status-format[0] "#[align=left]#(~/.local/bin/tmux-window-bar #{session_name} '#{?@paneDropWinBefore,#{@paneDropWinBefore},#{@dragInsertBeforeWin}}' '#{@paneDropWin}')"
set -g status-format[1] ""
# the reorder marker hides while the window bar holds the drop target, so only the outcome a release would have is shown
set -g status-format[2] "#[align=left]#(~/.local/bin/tmux-pane-bar #{window_id} '#{?#{||:#{@paneDropWin},#{@paneDropWinBefore}},,#{@dragInsertBefore}}')"
set -g status-format[3] ""

# ── Reload config ──
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ── Status bar ──
set -g status-position top
set -g status-interval 5

# ── Plugins ──
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'claude'
set -g @resurrect-hook-post-save-all '~/.local/bin/tmux-resurrect-save-panenames'
set -g @resurrect-hook-post-restore-all '~/.local/bin/tmux-resurrect-restore-panenames'

# single source of truth for the pill colors both bar scripts reference, working/idle x inactive/active
set -g @pill_working_inactive "fg=#cdd6f4,bg=#181825"
set -g @pill_working_active "fg=#11111b,bg=#b4befe,bold"
set -g @pill_idle_inactive "fg=#ffffff,bg=#8b5903"
set -g @pill_idle_active "fg=#11111b,bg=#fab642,bold"
set -g @pill_drop_target "fg=#11111b,bg=#f9e2af,bold"
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'

run '~/.tmux/plugins/tpm/tpm'

# continuum's own save script is slow (~300ms) even to just check whether a save is due, so it runs on its own background timer instead of on every status redraw
run-shell 'pid_file=/tmp/tmux-continuum-loop.pid; if [ ! -f "$pid_file" ] || ! kill -0 "$(cat "$pid_file" 2>/dev/null)" 2>/dev/null; then setsid ~/.local/bin/tmux-continuum-loop > /dev/null 2>&1 < /dev/null & echo $! > "$pid_file"; fi'

# highlights panes/windows where a claude session has finished and is waiting for input
run-shell 'pid_file=/tmp/tmux-claude-idle-loop.pid; if [ ! -f "$pid_file" ] || ! kill -0 "$(cat "$pid_file" 2>/dev/null)" 2>/dev/null; then setsid ~/.local/bin/tmux-claude-idle-loop > /dev/null 2>&1 < /dev/null & echo $! > "$pid_file"; fi'

# ── status-left is empty since the window bar (status-format[0]) replaces the native window list entirely ──
set -g status-left ""

# idle-claude border colors, deliberately independent from the bar's pill colors, placed after TPM since catppuccin resets pane-active-border-style on load
set -g pane-border-style "#{?@paneIdle,fg=#{@thm_mauve},fg=#{@thm_overlay_0}}"
# a title drag focuses the pane under the pointer, so the drop target's outline is drawn complete in yellow, borders shared with neighbours included
set -g pane-active-border-style "#{?@paneDropTgt,fg=#{@thm_yellow},#{?@paneIdle,fg=#ddc5fa,fg=magenta}}"

# rename/kill prompts should cover the full bar row, catppuccin's default leaves fill=default which only highlights the text itself
set -g message-style "fg=#{@thm_sky} bg=#{@thm_mantle} fill=#{@thm_mantle}"
set -g message-command-style "fg=#{@thm_sky} bg=#{@thm_mantle} fill=#{@thm_mantle}"
